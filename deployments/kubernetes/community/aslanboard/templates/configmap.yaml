apiVersion: v1
kind: ConfigMap
metadata:
  name: aslanboard-config
  labels:
    app.kubernetes.io/name: aslanboard
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  APP_DOMAIN: {{ .Values.config.appDomain | quote }}
  APP_RELEASE: {{ .Values.config.appRelease | quote }}
  WEB_URL: {{ .Values.config.webUrl | quote }}
  DEBUG: {{ .Values.config.debug | quote }}
  CORS_ALLOWED_ORIGINS: {{ .Values.config.corsAllowedOrigins | quote }}
  API_BASE_URL: {{ .Values.config.apiBaseUrl | quote }}
  LISTEN_HTTP_PORT: {{ .Values.config.listenHttpPort | quote }}
  LISTEN_HTTPS_PORT: {{ .Values.config.listenHttpsPort | quote }}
  SITE_ADDRESS: {{ .Values.config.siteAddress | quote }}
  PGHOST: {{ .Values.config.pgHost | quote }}
  PGDATABASE: {{ .Values.config.pgDatabase | quote }}
  POSTGRES_USER: {{ .Values.config.postgresUser | quote }}
  POSTGRES_DB: {{ .Values.config.postgresDb | quote }}
  POSTGRES_PORT: {{ .Values.config.postgresPort | quote }}
  PGDATA: {{ .Values.config.pgData | quote }}
  REDIS_HOST: {{ .Values.config.redisHost | quote }}
  REDIS_PORT: {{ .Values.config.redisPort | quote }}
  REDIS_URL: {{ .Values.config.redisUrl | quote }}
  RABBITMQ_HOST: {{ .Values.config.rabbitmqHost | quote }}
  RABBITMQ_PORT: {{ .Values.config.rabbitmqPort | quote }}
  RABBITMQ_USER: {{ .Values.config.rabbitmqUser | quote }}
  RABBITMQ_DEFAULT_USER: {{ .Values.config.rabbitmqUser | quote }}
  RABBITMQ_VHOST: {{ .Values.config.rabbitmqVhost | quote }}
  RABBITMQ_DEFAULT_VHOST: {{ .Values.config.rabbitmqVhost | quote }}
  USE_MINIO: {{ .Values.config.useMinio | quote }}
  AWS_REGION: {{ .Values.config.awsRegion | quote }}
  AWS_S3_ENDPOINT_URL: {{ .Values.config.awsS3EndpointUrl | quote }}
  AWS_S3_BUCKET_NAME: {{ .Values.config.awsS3BucketName | quote }}
  BUCKET_NAME: {{ .Values.config.awsS3BucketName | quote }}
  FILE_SIZE_LIMIT: {{ .Values.config.fileSizeLimit | quote }}
  GUNICORN_WORKERS: {{ .Values.config.gunicornWorkers | quote }}
  MINIO_ENDPOINT_SSL: {{ .Values.config.minioEndpointSsl | quote }}
  API_KEY_RATE_LIMIT: {{ .Values.config.apiKeyRateLimit | quote }}
  AUTHENTICATION_RATE_LIMIT: {{ .Values.config.authenticationRateLimit | quote }}
  TRUSTED_PROXIES: {{ .Values.config.trustedProxies | quote }}
  CERT_ACME_CA: {{ .Values.config.certAcmeCa | quote }}
  CERT_EMAIL: {{ .Values.config.certEmail | quote }}
  CERT_ACME_DNS: {{ .Values.config.certAcmeDns | quote }}
  WEBHOOK_ALLOWED_IPS: {{ .Values.config.webhookAllowedIps | quote }}
  WEBHOOK_ALLOWED_HOSTS: {{ .Values.config.webhookAllowedHosts | quote }}
