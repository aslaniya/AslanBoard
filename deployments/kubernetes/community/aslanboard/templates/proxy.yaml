apiVersion: v1
kind: Service
metadata:
  name: proxy
  labels:
    app.kubernetes.io/name: aslanboard
    app.kubernetes.io/component: proxy
spec:
  selector:
    app.kubernetes.io/name: aslanboard
    app.kubernetes.io/component: proxy
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: proxy
  labels:
    app.kubernetes.io/name: aslanboard
    app.kubernetes.io/component: proxy
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: aslanboard
      app.kubernetes.io/component: proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aslanboard
        app.kubernetes.io/component: proxy
    spec:
      containers:
        - name: proxy
          image: {{ .Values.images.proxy }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
              hostPort: {{ .Values.hostPort }}
          {{- include "aslanboard.envFrom" . | nindent 10 }}
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          {{- include "aslanboard.resources" . | nindent 10 }}
          volumeMounts:
            - name: config
              mountPath: /config
            - name: data
              mountPath: /data
      volumes:
        - name: config
          emptyDir: {}
        - name: data
          emptyDir: {}
